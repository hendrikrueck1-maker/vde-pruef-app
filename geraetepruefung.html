<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Prüfung elektrischer Geräte (DIN EN 50678 / 50699)</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- ===== PWA (Progressive Web App) ===== -->
  <meta name="description" content="Prüfprotokolle nach DIN VDE erstellen und als PDF ausgeben – offline nutzbar.">
  <meta name="theme-color" content="#003366">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- iOS-spezifisch -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VDE Protokoll">
  <meta name="format-detection" content="telephone=no">
  <script src="js/app-config.js"></script>
  <script src="js/pwa.js" defer></script>

  <script src="js/vendor/jspdf.umd.min.js"></script>
  <script src="js/vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="js/vendor/signature_pad.umd.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/pdf-utils.js"></script>
  <script src="js/geraete-generator.js"></script>

  <style>
    .grid-full { grid-column: 1 / -1; }
    textarea.auto-grow { resize: none; overflow: hidden; min-height: 38px; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header-bar">
    <div>
      <a href="index.html" class="btn btn-secondary" style="text-decoration:none;">← Zurück zur Hauptübersicht</a>
    </div>
    <h1>Prüfung elektrischer Geräte</h1>
    <div>
      <button type="button" class="btn btn-secondary" onclick="fillExampleDataGeraete()">+ Beispieldaten laden</button>
      <button type="button" class="btn btn-secondary" onclick="neuesGeraeteProtokoll()">+ Neues Formular</button>
    </div>
  </div>

  <form id="geraeteForm">
    <!-- 1. STAMMDATEN -->
    <h2>1. Allgemeine Angaben & Stammdaten</h2>
    <div class="grid">
      <div class="form-group grid-full">
        <label>Auftraggeber / Prüfort:</label>
        <input type="text" id="auftraggeber" placeholder="z. B. Stadttheater Konstanz, Inselgasse 2-6, 78462 Konstanz">
      </div>

      <div class="form-group">
        <label>Gebäude / Bereich:</label>
        <select id="gebaeude_select" onchange="toggleGebaeudeCustom(this.value)">
          <option value="Gr. Haus">Gr. Haus</option>
          <option value="Werkstatt">Werkstatt</option>
          <option value="Spiegelhalle">Spiegelhalle</option>
          <option value="Münsterplatz">Münsterplatz</option>
          <option value="Probebühne">Probebühne</option>
          <option value="custom">Sonstiges...</option>
        </select>
        <input type="text" id="gebaeude_custom" value="Gr. Haus" placeholder="Gebäude/Raum eingeben" style="display:none; margin-top:4px;">
      </div>

      <div class="form-group">
        <label>Prüfart:</label>
        <select id="pruefart">
          <option>Wiederholungsprüfung (DIN EN 50699 / VDE 0702)</option>
          <option>Prüfung nach Reparatur (DIN EN 50678 / VDE 0701)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Prüffrist:</label>
        <select id="pruefintervall" onchange="updateNaechsterTermin()">
          <option value="1">1 Monat</option>
          <option value="3">3 Monate</option>
          <option value="6">6 Monate</option>
          <option value="12" selected>1 Jahr</option>
          <option value="24">2 Jahre</option>
        </select>
      </div>

      <div class="form-group"><label>Prüflings-ID:</label><input type="text" id="pruefungsnummer" placeholder="z. B. GP-2026-001"></div>
      <div class="form-group"><label>Protokoll-Nr. (Auto):</label><input type="text" id="protokollnummer" readonly></div>
      <div class="form-group"><label>Prüfer/-in (Name):</label><input type="text" id="pruefer" placeholder="z. B. Max Mustermann"></div>
      <div class="form-group"><label>Prüfdatum:</label><input type="date" id="datum"></div>
      <div class="form-group"><label>Nächster Prüftermin (Auto):</label><input type="date" id="res_termin_date"></div>
      <div class="form-group"><label>Verwendetes Prüfgerät:</label><input type="text" id="messgeraet"></div>
      <div class="form-group"><label>Seriennummer Messgerät:</label><input type="text" id="seriennummer"></div>
      <div class="form-group"><label>Prüfgerät kalibriert bis:</label><input type="date" id="kalibriert_bis"></div>
    </div>

    <!-- 2. GERÄTE -->
    <h2>2. Geräte (Besichtigen, Erproben, Messen je Gerät)</h2>
    <div id="devicesContainer"></div>
    <button type="button" class="btn btn-secondary" onclick="addDeviceCard()">+ Gerät hinzufügen</button>

    <!-- 3. BEWERTUNG -->
    <h2>3. Gesamtbeurteilung & Prüfplakette</h2>
    <div class="grid">
      <div class="form-group">
        <label>Gesamtbewertung Mängel:</label>
        <select id="res_maengel">
          <option>Keine Mängel festgestellt</option>
          <option>Mängel festgestellt und behoben (siehe Bemerkung)</option>
          <option>Mängel festgestellt (siehe Bemerkung)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Prüfplakette erteilt:</label>
        <select id="res_plakette"><option>Ja</option><option>Nein</option></select>
      </div>
      <div class="form-group">
        <label>Sicherer Gebrauch gewährleistet:</label>
        <select id="res_gewaehrleistung">
          <option value="Ja">Ja (Geräte entsprechen den Normen)</option>
          <option value="Nein">Nein (Sicherheitsrisiko)</option>
        </select>
      </div>
    </div>

    <div class="form-group" style="margin-top: 8px;">
      <label>Mängel / Bemerkungen / Auflagen:</label>
      <textarea id="res_bemerkungen" class="auto-grow" rows="3" placeholder="Hier Mängel oder sonstige Bemerkungen eintragen..." oninput="this.style.height='auto'; this.style.height=this.scrollHeight+'px'"></textarea>
    </div>

    <!-- 4. UNTERSCHRIFTEN -->
    <h2>4. Konformitätsbestätigung & Unterschriften</h2>
    <div class="grid" style="margin-bottom:8px;">
      <div class="form-group"><label>Ort der Unterzeichnung:</label><input type="text" id="unterschrift_ort"></div>
    </div>

    <div class="sig-block">
      <div class="sig-card">
        <label>Unterschrift Prüfer/-in:</label>
        <canvas id="sigPruefer"></canvas>
        <button type="button" class="btn btn-secondary" onclick="padPruefer.clear()">Löschen</button>
      </div>
      <div class="sig-card">
        <label>Unterschrift Auftraggeber / Betreiber:</label>
        <canvas id="sigKunde"></canvas>
        <button type="button" class="btn btn-secondary" onclick="padKunde.clear()">Löschen</button>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-secondary" onclick="generatePDFGeraete(true)">📄 Leeres Protokoll drucken (für Hand-Ausfüllung)</button>
      <button type="button" class="btn btn-success" onclick="generatePDFGeraete(false)">📥 Ausgefülltes PDF generieren & herunterladen</button>
    </div>
  </form>
</div>

<script>
  let padPruefer, padKunde;

  document.getElementById('datum').valueAsDate = new Date();
  updateNaechsterTermin();

  applyMasterDataToForm();
  initProtokollNummer('GP');

  addDeviceCard();

  restoreGeraeteState(loadGeraeteAutosave());

  const pads = initSignaturePads();
  padPruefer = pads.pruefer;
  padKunde = pads.kunde;

  document.getElementById('geraeteForm').addEventListener('input', autosaveProtocol);
  document.getElementById('geraeteForm').addEventListener('change', autosaveProtocol);
</script>

</body>
</html>
